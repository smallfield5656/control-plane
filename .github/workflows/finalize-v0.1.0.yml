name: Finalize v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v0.1.0.yml'

permissions:
  contents: write

jobs:
  published-package-dogfood:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published CLI version
        run: |
          test "$(npx --yes @smallfield5656/control-plane@0.1.0 --version)" = "0.1.0"

      - name: Run published-package Golden Path
        run: |
          mkdir "$RUNNER_TEMP/control-plane-dogfood"
          cd "$RUNNER_TEMP/control-plane-dogfood"
          npx --yes @smallfield5656/control-plane@0.1.0 init my-app
          npx --yes @smallfield5656/control-plane@0.1.0 doctor my-app
          npx --yes @smallfield5656/control-plane@0.1.0 check my-app

  github-release:
    needs: published-package-dogfood
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: c46c1c6693f735388a4b30b0033f72aed6a8e8b6
    steps:
      - name: Create v0.1.0 tag and GitHub Release
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 release already exists."
            exit 0
          fi

          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "control-plane v0.1.0" \
            --notes $'Initial public CLI release.\n\nIncluded commands:\n- `control-plane init <directory>`\n- `control-plane doctor [directory]`\n- `control-plane check [directory]`\n\nQuick Start:\n```bash\nnpx @smallfield5656/control-plane@0.1.0 init my-app\n```\n\nThe published npm package was dogfooded from a clean GitHub Actions environment before this release was created.'
